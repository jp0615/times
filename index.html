<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="九九乘法">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>九九乘法小達人</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
html,body{margin:0;height:100%;font-family:-apple-system,"PingFang TC","Heiti TC","Microsoft JhengHei",sans-serif;background:linear-gradient(160deg,#fff1d6,#ffe3cc 50%,#dff0ff);color:#3a2e5a}
#app{max-width:980px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 24px);min-height:100%}
h1{font-size:40px;margin:6px 0;text-align:center}
h2{font-size:28px;margin:8px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.stars{background:#fff;border-radius:30px;padding:8px 20px;font-size:28px;font-weight:800;box-shadow:0 4px 0 #f3c94b;color:#e08a00}
.btn{display:block;border:0;border-radius:24px;padding:18px 22px;font-size:26px;font-weight:800;color:#fff;background:#ff7a59;box-shadow:0 6px 0 rgba(0,0,0,.18);cursor:pointer;font-family:inherit;text-align:center}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.blue{background:#3b9cff}.btn.green{background:#38c172}.btn.purple{background:#9b6bff}.btn.yellow{background:#ffb800;color:#5a3d00}.btn.gray{background:#8e8aa5}.btn.red{background:#ef5b73}.btn.orange{background:#ff8a1f}.btn.teal{background:#1fb5a8}.btn.pink{background:#e0529c}
.btn.small{font-size:18px;padding:10px 14px;border-radius:16px;display:inline-block}
.grid{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}
.card{background:#fff;border-radius:26px;padding:18px;box-shadow:0 6px 0 rgba(0,0,0,.08);margin:12px 0}
.hero{text-align:center;font-size:90px;margin:6px 0}
.mid{text-align:center;font-size:24px;color:#6a5d94}
.q{font-size:76px;font-weight:900;text-align:center;margin:10px 0;letter-spacing:2px;color:#3a2e5a}
.q .box{display:inline-block;min-width:1.6em;border-bottom:8px solid #ff8a1f;color:#ff8a1f}
.q .box.ok{color:#1f9d55;border-color:#38c172}
.hint{text-align:center;font-size:30px;color:#9b6bff;font-weight:800;min-height:40px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.opt{font-size:52px;padding:22px 10px;background:#fff;color:#3a2e5a;border:4px solid #ffd2a8;border-radius:26px;font-weight:900;cursor:pointer;font-family:inherit;box-shadow:0 6px 0 #ffd2a8}
.opt.ok{background:#b8f2cf;border-color:#38c172;box-shadow:0 6px 0 #38c172}
.opt.no{background:#ffd0d6;border-color:#ef5b73;animation:shake .4s}
.spk{font-size:30px;background:#3b9cff;border:0;border-radius:50%;width:60px;height:60px;color:#fff;box-shadow:0 4px 0 #1d6fc4;cursor:pointer;vertical-align:middle}
.spk:active{transform:translateY(3px)}
.bar{height:18px;background:#fff;border-radius:10px;overflow:hidden;margin:6px 0 10px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#38c172,#ffb800);transition:width .3s}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:520px;margin:14px auto 0}
.key{font-size:46px;font-weight:900;height:86px;border:0;border-radius:22px;background:#fff;color:#3a2e5a;box-shadow:0 6px 0 #ffd2a8;border:3px solid #ffd2a8;font-family:inherit;cursor:pointer}
.key:active{transform:translateY(4px);box-shadow:0 2px 0 #ffd2a8}
.key.ok{background:#38c172;color:#fff;border-color:#2a9a5a;box-shadow:0 6px 0 #2a9a5a}
.key.del{background:#ffe7c2;font-size:36px}
.seq{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.seq span{min-width:96px;height:96px;line-height:96px;background:#fff;border-radius:22px;font-size:46px;font-weight:900;text-align:center;box-shadow:0 5px 0 #ffd2a8;padding:0 8px}
.seq span.gap{background:#fff7e0;border:4px dashed #ff8a1f;color:#ff8a1f;line-height:88px}
.mcard{height:120px;border-radius:20px;border:0;font-size:38px;font-weight:900;font-family:inherit;background:#ff8a1f;color:#fff;box-shadow:0 5px 0 #c9620a;cursor:pointer;padding:4px}
.mcard.up{background:#fff;color:#3a2e5a;box-shadow:0 5px 0 #ffd2a8;border:3px solid #ffd2a8}
.mcard.eq{font-size:32px}
.mcard.done{background:#b8f2cf;color:#1d6b3e;box-shadow:none;pointer-events:none;border:0}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.msg{text-align:center;font-size:32px;font-weight:800;min-height:48px;color:#e0527a;margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0}
.chip{min-width:70px;height:70px;border-radius:20px;border:3px solid #ffd2a8;background:#fff;font-size:34px;font-weight:900;color:#3a2e5a;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #ffd2a8}
.chip.on{background:#ff8a1f;color:#fff;border-color:#c9620a;box-shadow:0 4px 0 #c9620a}
.chip.wide{min-width:auto;padding:0 18px;font-size:22px}
.lrow{display:flex;align-items:center;gap:14px;background:#fff;border-radius:20px;padding:10px 16px;margin:8px 0;box-shadow:0 4px 0 #ffd2a8;cursor:pointer;transition:transform .2s}
.lrow .eq{font-size:34px;font-weight:900;flex:1}
.lrow .kj{font-size:38px;font-weight:900;color:#e0561f;letter-spacing:4px}
.lrow.hide .eq,.lrow.hide .kj{visibility:hidden}
.lrow.hide{background:#fff7ec}
.lrow.cur{background:#fff3b0;transform:scale(1.03);box-shadow:0 4px 0 #ffb800}
.ltools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.timer{font-size:56px;font-weight:900;text-align:center;color:#e0561f}
.score{font-size:30px;font-weight:800;text-align:center}
.heat{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:10px}
.heat div{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:#3a2e5a;cursor:pointer;flex-direction:column;line-height:1.05}
.heat div small{font-size:11px;font-weight:600;opacity:.85}
.heat .hd{background:none;color:#8e8aa5;font-size:20px;cursor:default}
.lv0{background:#eeeaf6;color:#a39dbb!important}.lv1{background:#ff9aa8}.lv2{background:#ffc078}.lv3{background:#ffe27a}.lv4{background:#a6e8b9}.lv5{background:#2fae62;color:#fff!important}
.legend{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;font-size:15px;margin-top:10px}
.legend span{padding:4px 10px;border-radius:10px}
.hwcells{display:flex;gap:14px;justify-content:center}
.hwcell{position:relative;background:#fff;border:4px solid #ffd2a8;border-radius:22px;box-shadow:0 6px 0 #ffd2a8;overflow:hidden}
.hwcell canvas{display:block;touch-action:none;-webkit-touch-callout:none}
.hwlab{position:absolute;left:10px;top:6px;font-size:16px;color:#c2a98c;pointer-events:none}
.hwtools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.hwst{font-size:16px;color:#8e8aa5;text-align:center;margin-top:8px;min-height:20px}
.hwpen{display:block;margin-top:10px;font-size:18px;color:#6a5d94;text-align:center}.hwpen input{width:22px;height:22px;vertical-align:middle}
.hwimg{max-width:100%;border-radius:12px;border:2px solid #ffd2a8;display:block;margin:0 auto}
.set{display:block;font-size:22px;padding:10px 0;border-bottom:1px dashed #f1dcc4}.set input{width:24px;height:24px;vertical-align:middle;margin-right:8px}
textarea{width:100%;font-size:18px;padding:12px;border:3px solid #ffd2a8;border-radius:16px;font-family:inherit;background:#fff;color:#3a2e5a;min-height:110px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}
.wide #app{max-width:none;padding:calc(env(safe-area-inset-top) + 6px) 10px calc(env(safe-area-inset-bottom) + 6px)}
.chbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chbar h2{margin:0 6px;font-size:24px;flex:1;white-space:nowrap}
.chbar .chip{height:44px;min-width:auto;padding:0 12px;font-size:17px;border-radius:14px;box-shadow:0 3px 0 #ffd2a8}
.chbar .chip.on{box-shadow:0 3px 0 #c9620a}
.chart{display:grid;gap:8px}
.blk{display:flex;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.08);min-height:0}
.blk .side{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;cursor:pointer;flex:0 0 auto}
.blk .side b{font-weight:900;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.blk .side span{line-height:1.1}
.blk .rows{flex:1;display:flex;flex-direction:column;justify-content:space-around;padding:2px 8px 2px 10px;min-width:0}
.crow{display:flex;align-items:center;font-weight:800;white-space:nowrap;cursor:pointer;border-radius:8px;padding:0 4px;line-height:1.15}
.crow.cur{background:#fff3b0}
.crow .ans{border-radius:6px;padding:0 3px;margin-left:2px}
.crow .ans.cov{color:transparent!important;background:#e9e2f7;width:1.9em;overflow:hidden;vertical-align:bottom;display:inline-block;text-align:center;position:relative}
.chart.kj .crow .ans.cov{width:3.2em}
.crow .ans.cov:after{content:'?';color:#a39dbb;position:absolute;left:0;right:0}
.crow .dot{width:.45em;height:.45em;border-radius:50%;margin-left:auto;flex:0 0 auto}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .5s}.shake{animation:shake .4s}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#3a2e5a;color:#fff;padding:14px 26px;border-radius:24px;font-size:22px;z-index:60;display:none;max-width:90%;text-align:center}
.sx-cap{width:96px;height:96px;margin:0 auto 6px;border-radius:50%;position:relative;background:linear-gradient(180deg,#ffb020 0 48%,#3a2e5a 48% 54%,#fff 54%);border:6px solid #3a2e5a;animation:sxSpin 1s ease-out both}
.sx-cap i{position:absolute;left:16px;top:10px;width:22px;height:13px;border-radius:50%;background:rgba(255,255,255,.75);transform:rotate(-25deg)}
@keyframes sxSpin{0%{transform:rotate(-540deg) scale(.2)}100%{transform:none}}
.ov{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(58,46,90,.55);z-index:70;display:flex;align-items:center;justify-content:center;padding:24px}
/* ---------- 🏐 排球比賽 ---------- */
.court{position:relative;display:flex;align-items:stretch;gap:8px;margin:2px 0 6px;height:76px}
.cteam{flex:0 0 21%;background:#fff;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(0,0,0,.08);min-width:0;padding:2px 6px;line-height:1.15}
.cteam b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cteam span{font-size:32px;font-weight:900;line-height:1}
.cteam.us{border:3px solid #ff8a1f}.cteam.us span{color:#ff7a1f}.cteam.them{border:3px solid #5a6bd8}.cteam.them span{color:#5a6bd8}
.cfield{flex:1;position:relative;border-radius:14px;overflow:hidden;background:linear-gradient(180deg,#bfe3ff 0 30%,#ffc977 30%,#f0a64e);min-width:0}
.cfield svg.cbg{position:absolute;left:0;top:0;width:100%;height:100%}
.copp{position:absolute;right:9%;bottom:6px;font-size:30px;line-height:1}
.cball{position:absolute;left:22%;top:52%;width:26px;height:26px;margin:-13px 0 0 -13px;z-index:2}
.cball svg{width:100%;height:100%;display:block}
.cball.hit{animation:vlHit .8s ease-out both}.cball.spike{animation:vlSpike .75s cubic-bezier(.3,.1,.4,1) both}.cball.drop{animation:vlDrop 1s ease-in both}
@keyframes vlHit{0%{left:22%;top:55%}30%{left:34%;top:12%}55%{left:52%;top:8%;transform:rotate(200deg)}100%{left:80%;top:78%;transform:rotate(420deg)}}
@keyframes vlSpike{0%{left:24%;top:50%}30%{left:40%;top:4%;transform:scale(1.35)}45%{left:46%;top:6%;transform:scale(1.45) rotate(120deg)}100%{left:86%;top:84%;transform:scale(1) rotate(520deg)}}
@keyframes vlDrop{0%{left:78%;top:18%}45%{left:40%;top:20%;transform:rotate(-160deg)}75%{left:26%;top:82%}85%{left:24%;top:66%}100%{left:22%;top:84%;transform:rotate(-300deg)}}
.cmsg{position:absolute;left:0;right:0;top:4px;text-align:center;font-weight:900;font-size:20px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.4);pointer-events:none;z-index:3;white-space:nowrap}
.cmsg.big{font-size:26px;color:#fff36b;animation:pop .5s}
.cstage{position:absolute;left:0;right:0;bottom:1px;text-align:center;font-size:12px;color:#7a4a12;font-weight:800;pointer-events:none}
.court.slim{height:40px;margin:0 0 6px}.court.slim .cteam{flex-direction:row;gap:6px;border-radius:12px}.court.slim .cteam b{font-size:13px}.court.slim .cteam span{font-size:22px}.court.slim .copp{font-size:20px;bottom:3px}.court.slim .cball{width:20px;height:20px;margin:-10px 0 0 -10px}.court.slim .cmsg{font-size:15px;top:2px}.court.slim .cmsg.big{font-size:18px}.court.slim .cstage{display:none}
.bump{animation:pop .45s}
.vlhome{display:flex;align-items:center;justify-content:center;gap:10px;font-size:20px;color:#6a5d94;margin-top:4px}
.vlcard{background:linear-gradient(135deg,#fff,#eef3ff);border:3px solid #5a6bd8;border-radius:22px;padding:12px 16px;margin:10px 0;font-size:22px;line-height:1.5;text-align:center}
.vlcard .ev{font-weight:900;color:#e0561f;font-size:24px}
.vlhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.vlhead input{font-size:24px;padding:8px 12px;border:3px solid #ffd2a8;border-radius:14px;font-family:inherit;width:9em;max-width:60vw;color:#3a2e5a}
.ladder{display:grid;gap:10px}
.lstep{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:#fff;border-radius:18px;padding:10px 14px;box-shadow:0 4px 0 rgba(0,0,0,.06);border:3px solid #eee}
.lstep.cur{border-color:#ff8a1f;background:#fff7e8}.lstep.done{border-color:#38c172}.lstep.lock{opacity:.6}
.lstep .nm{font-size:24px;font-weight:900;flex:0 0 7em}.lstep .ops{display:flex;gap:8px;flex:0 0 auto}
.lstep .ops span{font-size:26px;width:46px;height:46px;border-radius:50%;background:#f2f0f8;display:flex;align-items:center;justify-content:center;position:relative}
.lstep .ops span.w:after{content:'✔';position:absolute;right:-4px;bottom:-4px;font-size:16px;background:#38c172;color:#fff;border-radius:50%;width:20px;height:20px;line-height:20px;text-align:center}
.lstep .st{font-size:17px;color:#6a5d94;flex:1 1 200px}
.lstep svg{flex:0 0 auto}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pcard{background:#fff;border-radius:18px;padding:10px 8px;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.08);border:3px solid #eee;line-height:1.3}
.pcard b{font-size:22px;display:block}.pcard small{font-size:15px;color:#6a5d94;display:block}
.pcard.lock{background:#f4f2f8}.pcard.lock b{color:#a39dbb}
.pcard .pb{height:10px;background:#e9e2f7;border-radius:6px;overflow:hidden;margin:6px 6px 0}.pcard .pb i{display:block;height:100%;background:#9b6bff}
.shelf{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.shelf div{text-align:center;font-size:15px;font-weight:800;color:#6a5d94;width:110px}
.shelf .no{opacity:.25;filter:grayscale(1)}
@media (max-height:860px) and (orientation:landscape){.q{font-size:64px;margin:4px 0}.key{height:70px}.pad{gap:10px;margin-top:8px}.hint{min-height:34px;font-size:26px}.msg{min-height:40px;font-size:28px}.opt{padding:16px 10px}}
@media (max-width:600px){.q{font-size:54px}.opt{font-size:40px}.key{height:70px;font-size:38px}.seq span{min-width:64px;height:70px;line-height:70px;font-size:34px}.seq span.gap{line-height:62px}.lrow .eq{font-size:26px}.lrow .kj{font-size:28px;letter-spacing:2px}.heat div{font-size:13px}.heat div small{display:none}.mcard{font-size:28px}.mcard.eq{font-size:22px}.chip{min-width:56px;height:56px;font-size:28px}}
</style>

<body>
<div id="app"></div>
<canvas id="fx"></canvas>
<div id="toast"></div>
<script>
(function(){
'use strict';
var KEY='timesApp.v1';
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rnd(n){return Math.floor(Math.random()*n)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}
function now(){return Date.now()}

/* ---------- 資料 ---------- */
var D;
function blank(){return {v:1,stars:0,stats:{},best:{},sel:[2,3,4,5,6,7,8,9],slow:false,autoSay:true,sound:true,hwOcr:true,penOnly:false,learnA:2,learnMode:'kj',voice:'dad',vc:{}}}
function load(){var b=blank(),o=null;try{o=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  D=(o&&typeof o==='object')?o:b;for(var k in b)if(D[k]===undefined)D[k]=b[k];
  if(!Array.isArray(D.sel)||!D.sel.length)D.sel=b.sel.slice();
  if(!D.dadV){D.dadV=1;D.voice='dad'} /* 改用爸爸的聲音當預設（只切換一次，之後尊重選擇） */
  D.sel=D.sel.filter(function(a){return a>=2&&a<=9});if(!D.sel.length)D.sel=b.sel.slice();vlInit()} /* 練習不出 1 的乘法 */
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('儲存失敗，請檢查儲存空間')}}
function fk(a,b){return a+'x'+b}
/* 記錄一題：ok 是否第一次就答對；ms 作答秒數（毫秒） */
function rec(a,b,ok,ms){var s=D.stats[fk(a,b)]||(D.stats[fk(a,b)]={c:0,w:0,h:'',ms:0,mn:0});
  if(ok){s.c++;if(ms>0&&ms<60000){s.ms+=ms;s.mn++}}else s.w++;
  s.h=(String(s.h||'')+(ok?'1':'0')).slice(-6);s.t=now();save();sxLog(a,b,ok)}
function acc(s){return s&&s.c+s.w?s.c/(s.c+s.w):null}
function avgSec(s){return s&&s.mn?s.ms/s.mn/1000:null}
/* 熟練度 0 沒練過、1 很需要加強、2 加強中、3 快會了、4 會了、5 熟練 */
function level(a,b){var s=D.stats[fk(a,b)];if(!s||s.c+s.w===0)return 0;
  var p=acc(s),h=String(s.h||''),last=function(n){return h.length>=n&&h.slice(-n).indexOf('0')<0},t=avgSec(s);
  if(s.c>=5&&last(4)&&p>=0.8&&(t===null||t<=5))return 5;
  if(s.c>=3&&last(3)&&p>=0.7)return 4;
  if(p>=0.75&&last(1))return 3;
  if(p>=0.5)return 2;return 1}
var LVN=['還沒練過','很需要加強','加強中','快會了','會了','熟練'];

/* ---------- 數字與口訣（台灣傳統九九唸法） ---------- */
var ZD=['零','一','二','三','四','五','六','七','八','九'];
function zhNum(n){ /* 一般唸法：10 十、12 十二、20 二十、81 八十一 */
  if(n<10)return ZD[n];if(n<20)return '十'+(n%10?ZD[n%10]:'');
  return ZD[Math.floor(n/10)]+'十'+(n%10?ZD[n%10]:'')}

  h+='</div><div class="chips"><button class="chip wide" data-a="mall" data-m="2">2～9 全部</button></div><div class="mid" style="font-size:17px">挑戰只出 2～9 × 2～9（×1 太簡單，不出題）</div>'+
  '<div class="mid" style="font-size:20px">目前：'+esc(selName(D.sel))+'　｜　答錯的題目會比較常出現</div></div>'+
  '<div class="grid g2">'+
  '<button class="btn green" data-a="start" data-g="mix">🌈 綜合挑戰</button>'+
  '<button class="btn blue" data-a="start" data-g="choice">🔘 選選看</button>'+
  '<button class="btn purple" data-a="start" data-g="fill">🔢 填填看（數字鍵盤）</button>'+
  '<button class="btn teal" data-a="start" data-g="pattern">🔍 找規律</button>'+
  '<button class="btn red" data-a="start" data-g="match">🃏 翻牌配對</button>'+
  '<button class="btn pink" data-a="start" data-g="write">✍️ 手寫答案</button>'+
  '<button class="btn orange" style="grid-column:1/-1" data-a="start" data-g="timed">⏱️ 60 秒挑戰（最佳：'+(D.best[selKey(D.sel)]||0)+' 題）</button></div>';
  app.innerHTML=h}

/* ---------- 出題 ---------- */
function poolOf(sel){var p=[];sel.forEach(function(a){if(a<2||a>9)return;for(var b=2;b<=9;b++)p.push({a:a,b:b})});return p} /* 乘數或被乘數是 1 的題目不出 */
function weight(f){var s=D.stats[fk(f.a,f.b)];if(!s||s.c+s.w===0)return 3.5;
  var t=s.c+s.w,w=1+(s.w/t)*6+(t<3?1.5:0),h=String(s.h||'').slice(-3);
  for(var i=0;i<h.length;i++)if(h[i]==='0')w+=1.5;
  var sec=avgSec(s);if(sec!==null&&sec>6)w+=1;
  return w}
function pickFact(pool,avoid){var c=pool.filter(function(f){return avoid.indexOf(fk(f.a,f.b))<0});if(!c.length)c=pool;
  var tot=0;c.forEach(function(f){tot+=weight(f)});var r=Math.random()*tot;
  for(var i=0;i<c.length;i++){r-=weight(c[i]);if(r<=0)return c[i]}return c[c.length-1]}
function distract(a,b){var p=a*b,c1=[a*(b+1),a*(b-1),(a+1)*b,(a-1)*b],c2=[p+1,p-1,p+2,p-2,p+10,p-10,a+b];
  if(p>=10&&p%10!==Math.floor(p/10))c2.push((p%10)*10+Math.floor(p/10));
  var seen={},out=[];seen[p]=1;
  function add(list){shuffle(list).forEach(function(x){if(out.length<3&&x>0&&x<=90&&!seen[x]){seen[x]=1;out.push(x)}})}
  add(c1.slice(0,2+rnd(3)));add(c2);add(c1);return out}
function startQuiz(g){
  if(!D.sel.length){toast('請先選至少一個乘法表');return}
  if(g==='timed')return startTimed();
  var pool=poolOf(D.sel);
  if(g==='match'&&!matchable(pool)){notice('翻牌配對需要至少 4 個不同的答案，請多選一個乘法表再玩喔！');return}
  var N=g==='match'?3:g==='write'?8:10,types=[];
  for(var i=0;i<N;i++){var t=g;
    if(g==='mix'){var ts=['choice','fill','pattern','choice','fill'];t=ts[rnd(ts.length)];if(i===4&&matchable(pool))t='match';if(i===8&&D.hwOcr!==false&&rnd(2))t='write'}
    types.push(t)}
  G={g:g,pool:pool,types:types,i:0,first:0,gained:0,recent:[],requeue:[],locked:false,sel:D.sel.slice()};
  if(g==='write'||types.indexOf('write')>=0)DR.ensure();
  view='quiz';quizQ()}
function matchable(pool){var s={};pool.forEach(function(f){s[f.a*f.b]=1});return Object.keys(s).length>=4}
function qHead(){return topbar(false).replace('<span></span>','<button class="btn small gray" data-a="quit">✕ 結束</button>')+'<div class="bar"><i style="width:'+(G.i/G.types.length*100)+'%"></i></div>'+vlCourt()}
function nextFact(){
  var f;if(G.requeue.length&&G.requeue[0].at<=G.i)f=G.requeue.shift().f;else f=pickFact(G.pool,G.recent);
  G.recent.push(fk(f.a,f.b));if(G.recent.length>4)G.recent.shift();return f}
function sayBtn(){return '<button class="spk" data-a="qsay">🔊</button>'}
function quizQ(){
  if(G.i>=G.types.length)return finish();
  var t=G.types[G.i];G.locked=false;G.tried=0;G.t0=now();hush();
  if(t==='match')return matchQ();
  var f=nextFact();G.f=f;G.miss=false;
  var a=f.a,b=f.b,p=a*b,h=qHead();
  if(t==='choice'){
    G.opts=shuffle([p].concat(distract(a,b)));
    h+='<div class="mid">選出正確答案 '+sayBtn()+'</div><div class="q">'+a+' × '+b+' = <span class="box" id="ans">?</span></div><div class="hint" id="hint"></div>'+
    '<div class="opts">'+G.opts.map(function(o,i){return '<button class="opt" data-a="ans" data-i="'+i+'">'+o+'</button>'}).join('')+'</div><div class="msg" id="msg"></div>';
    app.innerHTML=h;autoSay(Q(a,b));
  }else if(t==='fill'){
    G.miss=Math.random()<0.2&&a>1; /* 偶爾挖掉乘數：3 × ? = 12 */
    G.target=G.miss?b:p;G.inp='';
    h+='<div class="mid">'+(G.miss?'空格裡是多少？':'用數字鍵盤寫答案')+' '+sayBtn()+'</div><div class="q" id="qline"></div><div class="hint" id="hint"></div>'+padHtml()+'<div class="msg" id="msg"></div>';
    app.innerHTML=h;fillDraw();autoSay(G.miss?M(a,b):Q(a,b));
  }else if(t==='pattern'){
    var lo=Math.max(1,b-4),hi=Math.min(b,5),st=lo+rnd(hi-lo+1);
    G.seq=[];for(var k=st;k<st+5;k++)G.seq.push(k);
    var os=[p,p+a,p-a,p+1,p-1,p+2].filter(function(x,i,arr){return x>0&&arr.indexOf(x)===i});
    G.opts=shuffle([p].concat(shuffle(os.slice(1)).slice(0,3)));
    h+='<div class="mid">🔍 找規律：空格裡是多少？</div><div class="seq">'+G.seq.map(function(k){return k===b?'<span class="gap" id="ans">?</span>':'<span>'+(a*k)+'</span>'}).join('')+'</div><div class="hint" id="hint"></div>'+
    '<div class="opts">'+G.opts.map(function(o,i){return '<button class="opt" data-a="ans" data-i="'+i+'">'+o+'</button>'}).join('')+'</div><div class="msg" id="msg"></div>';
    app.innerHTML=h;
  }else if(t==='write'){hwInit()}
}
function autoSay(pr){if(D.autoSay!==false)setTimeout(function(){if(view==='quiz')sp(pr)},250)}
function qSay(){var t=G&&G.types[G.i],f=G&&G.f;if(!f)return;
  if(t==='fill'&&G.miss)sp(M(f.a,f.b));else if(t==='pattern')sp(P(f.a));else sp(Q(f.a,f.b))}
function padHtml(){var k='';[1,2,3,4,5,6,7,8,9].forEach(function(n){k+='<button class="key" data-a="key" data-k="'+n+'">'+n+'</button>'});
  return '<div class="pad">'+k+'<button class="key del" data-a="key" data-k="del">⌫</button><button class="key" data-a="key" data-k="0">0</button><button class="key ok" data-a="key" data-k="ok">✔</button></div>'}
function fillDraw(okState){var f=G.f,box='<span class="box'+(okState?' ok':'')+'">'+(G.inp||'&nbsp;')+'</span>';
  $('#qline').innerHTML=G.miss?f.a+' × '+box+' = '+(f.a*f.b):f.a+' × '+f.b+' = '+box}
function showHint(){var f=G.f,el=$('#hint');if(!el)return;
  var t=G.types[G.i];
  el.textContent=t==='pattern'?'提示：每次多 '+f.a+' 喔！':'💡 口訣：'+kj(f.a,f.b);
  el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');
  speakSeq([C(G.tried>1?'try2':'try1'),t==='pattern'?P(f.a):K(f.a,f.b)])}
function wrongOnce(){if(!G.tried){rec(G.f.a,G.f.b,false);G.requeue.push({f:G.f,at:G.i+3});vlMiss(G.f.a,G.f.b)}G.tried++}
function right(){
  var first=!G.tried,ms=now()-G.t0;
  if(first){rec(G.f.a,G.f.b,true,ms);G.first++;G.gained++;D.stars++;save();vlHit(G.f.a,G.f.b)}
  sndOk();confetti(first?70:30);var pw=praise(),m=$('#msg');if(m){m.textContent=pw;m.classList.add('pop')}
  var f=G.f,g=G,list=[K(f.a,f.b)];if(/^飛吧/.test(pw))list.unshift(C('fly'));else if(first&&Math.random()<0.35)list.unshift(C(['ok1','ok2','ok3'][rnd(3)]));
  G.i++;var t0=now(),gone=false;function nx(){if(gone)return;gone=true;if(view==='quiz'&&G===g)quizQ()}
  setTimeout(function(){if(view==='quiz'&&G===g)speakSeq(list,function(){setTimeout(nx,Math.max(250,1300-(now()-t0)))})},300);
  setTimeout(nx,5500)}
function onAns(i){if(G.locked)return;var o=G.opts[i],btn=document.querySelectorAll('.opt')[i];
  if(o===G.f.a*G.f.b){G.locked=true;btn.classList.add('ok');var an=$('#ans');if(an){an.textContent=o;an.classList.add('ok')}right()}
  else{sndNo();btn.classList.add('no');btn.style.pointerEvents='none';wrongOnce();$('#msg').textContent=tryag();showHint()}}
function onKey(k){if(G.locked)return;
  if(k==='del'){G.inp=G.inp.slice(0,-1);sndTap();fillDraw();return}
  if(k==='ok'){if(!G.inp){toast('先按數字喔');return}return fillCheck()}
  if(G.inp.length>=2)return;G.inp+=k;sndTap();fillDraw();
  if(+G.inp===G.target)fillCheck();else if(G.inp.length>=String(G.target).length&&G.inp.length>=2)fillCheck()}
function fillCheck(){
  if(+G.inp===G.target){G.locked=true;fillDraw(true);right()}
  else{sndNo();var q=$('#qline');q.classList.remove('shake');void q.offsetWidth;q.classList.add('shake');wrongOnce();$('#msg').textContent=tryag();G.inp='';fillDraw();showHint()}}

/* 翻牌配對 */
function matchQ(){var used={},fs=[],tries=0;
  while(fs.length<4&&tries++<200){var f=pickFact(G.pool,fs.map(function(x){return fk(x.a,x.b)}));if(!used[f.a*f.b]){used[f.a*f.b]=1;fs.push(f)}}
  var cards=[];fs.forEach(function(f,i){cards.push({id:i,f:f,side:'eq'});cards.push({id:i,f:f,side:'p'})});
  G.m={cards:shuffle(cards),open:[],done:0,total:fs.length,bad:{}};matchDraw()}
function matchDraw(){var m=G.m;
  app.innerHTML=qHead()+'<div class="mid">翻翻看：把算式和答案配成一對</div><div class="mgrid">'+m.cards.map(function(c,i){
    var up=m.open.indexOf(i)>=0||c.done,txt=c.side==='eq'?c.f.a+' × '+c.f.b:String(c.f.a*c.f.b);
    return '<button class="mcard'+(up?' up':'')+(c.side==='eq'?' eq':'')+(c.done?' done':'')+'" data-a="flip" data-i="'+i+'">'+(up?txt:'🏐')+'</button>'}).join('')+'</div><div class="msg" id="msg"></div>'}
function onFlip(i){var m=G.m,c=m.cards[i];if(G.locked||c.done||m.open.indexOf(i)>=0)return;
  m.open.push(i);sndTap();matchDraw();
  if(m.open.length===2){var a=m.cards[m.open[0]],b=m.cards[m.open[1]];G.locked=true;
    if(a.id===b.id){a.done=b.done=true;m.done++;m.open=[];
      var hit=!m.bad[a.id];if(hit){rec(a.f.a,a.f.b,true);D.stars++;G.gained++;save()}
      sndOk();confetti(30);G.locked=false;matchDraw();if(hit)vlHit(a.f.a,a.f.b);$('#msg').textContent=praise();sp(K(a.f.a,a.f.b));
      if(m.done===m.total){G.locked=true;G.first++;G.i++;sndWin();confetti(100);setTimeout(function(){if(view==='quiz')quizQ()},1800)}}
    else{sndNo();[a,b].forEach(function(x){if(x.side==='eq'&&!m.bad[x.id]){m.bad[x.id]=1;rec(x.f.a,x.f.b,false);vlMiss(x.f.a,x.f.b)}});
      $('#msg').textContent=tryag();setTimeout(function(){m.open=[];G.locked=false;if(view==='quiz')matchDraw()},900)}}}

function finish(){var n=G.types.length,bonus=0;vlRefresh(vlRound().ev);
  if(G.first===n&&n>=3){bonus=3;D.stars+=3;G.gained+=3}
  save();view='result';sndWin();confetti(160);render();var pp=G.first/n;setTimeout(function(){if(view==='result')sp(C(pp===1?'great':pp>=.6?'ok3':'try1'))},900);roundDone(G.sel,n,G.g)}
function result(){var n=G.types.length,p=G.first/n,face=p>=.9?'🏆':p>=.6?'🎉':'💪';
  app.innerHTML=topbar(false)+'<div class="hero pop">'+face+'</div><h1>'+(p>=.9?'太厲害了！':p>=.6?'表現很棒！':'再接再厲！')+'</h1>'+
  '<div class="card mid" style="font-size:30px">第一次就答對：<b>'+G.first+' / '+n+'</b><br>這次獲得：<b style="color:#e08a00">⭐ '+G.gained+'</b>'+(G.first===n&&n>=3?'<br>全對獎勵 +3 ⭐':'')+
  (p>=.6?'<div style="margin-top:10px;color:#e0561f">'+VB[rnd(VB.length)]+'</div>':'')+'</div>'+vlResultCard()+
  '<div class="grid g2"><button class="btn green" data-a="again">🔁 再玩一次</button><button class="btn blue" data-a="home">🏠 回首頁</button></div>'}

/* ---------- 換個系列練練看（溫和提醒） ---------- */
/* 只記單一系列的練習；混合多個系列記成 0。連續 3 輪（或今天這個系列 5 輪以上且佔今天大多數）都練同一個系列，
   而且有別的系列比較不熟（或這個系列已經很熟），結算時跳出提醒。提醒後同一系列要再連練 3 輪才會再提醒。 */
function tblScore(a){var s=0,n=0;for(var b=2;b<=9;b++){s+=level(a,b);var st=D.stats[fk(a,b)];if(st)n+=st.c+st.w}return {lv:s/8,n:n}}
function dayKey(t){var d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function roundDone(sel,n,g){if(!sel)return;var k=sel.length===1?sel[0]:0;
  D.hist=(D.hist||[]).concat([{k:k,t:now(),n:n||0,g:g}]).slice(-40);save();
  var sy=sxSync();setTimeout(function(){sy.then(function(){if((view==='result'||view==='tresult')&&!$('#nudge')&&!sxCheck())nudgeCheck()})},1800)}
function nudgeInfo(){var h=D.hist||[];if(!h.length)return null;var k=h[h.length-1].k;if(!k)return null;
  var st=0;for(var i=h.length-1;i>=0&&h[i].k===k;i--)st++;
  var today=dayKey(now()),td=h.filter(function(x){return dayKey(x.t)===today}),tk=td.filter(function(x){return x.k===k});
  var heavy=tk.length>=5&&tk.length>=td.length*0.7;
  var nd=D.nudge||{};
  /* 提醒過這個系列以後，要從那次之後再連續練 3 輪才再提醒 */
  if(nd.k===k){var since=0;for(var j=h.length-1;j>=0&&h[j].t>nd.t&&h[j].k===k;j--)since++;if(since<3)return null}
  if(st<3&&!heavy)return null;
  var me=tblScore(k),others=[];for(var a=2;a<=9;a++)if(a!==k){var sc=tblScore(a);others.push({a:a,lv:sc.lv,n:sc.n,r:Math.random()})}
  others.sort(function(x,y){return x.lv-y.lv||x.n-y.n||x.r-y.r});
  var mastered=me.lv>=3.5;if(!mastered&&!(others[0].lv<me.lv))return null;
  return {k:k,streak:st,today:tk.length,mastered:mastered,rec:others.slice(0,2).map(function(o){return o.a})}}
var NUDGE_HEAD=['🏐 換個位置練練看！','🧢 教練有話要說！','🏐 來練別的位置吧！'];
function nudgeCheck(){var x=nudgeInfo();if(!x||$('#nudge'))return false;
  D.nudge={k:x.k,t:now()};save();
  var rec=x.rec.map(function(a){return ZD[a]+'的乘法'}).join('」和「');
  var why=x.mastered?'「'+ZD[x.k]+'的乘法」你已經練得超熟了！⭐':'你已經'+(x.streak>=3?'連續練了 '+x.streak+' 輪':'今天練了 '+x.today+' 輪')+'「'+ZD[x.k]+'的乘法」，好認真！💪';
  var pos=x.rec.map(function(a){return VL_PL[a][1]}).join('和');
  var tip=['🧢 教練說：換去練「'+rec+'」，球隊也需要'+pos+'喔！','🧢 教練說：厲害的球隊每個位置都要練！去練「'+rec+'」，幫'+pos+'加油吧！','🧢 教練說：換「'+rec+'」上場，讓'+pos+'也變成你的拿手位置！'][rnd(3)];
  var o=document.createElement('div');o.id='nudge';o.className='ov';
  o.innerHTML='<div class="card mid pop" style="max-width:560px;line-height:1.5"><div style="font-size:64px">🏐</div><div style="font-size:32px;font-weight:900;color:#e0561f">'+NUDGE_HEAD[rnd(NUDGE_HEAD.length)]+'</div>'+
  '<div style="font-size:24px;margin:10px 0;color:#3a2e5a">'+why+'<br>'+tip+'</div><div class="grid" style="gap:12px;margin-top:14px">'+
  x.rec.map(function(a,i){return '<button class="btn '+(i?'blue':'green')+'" data-a="nudgego" data-n="'+a+'">🏐 去練「'+ZD[a]+'的乘法」</button>'}).join('')+
  '<button class="btn small gray" data-a="nudgeclose" style="justify-self:center">再練一下「'+ZD[x.k]+'的乘法」</button></div></div>';
  document.body.appendChild(o);try{sndOk()}catch(e){}return true}

/* ---------- 🏐 排球比賽（每天看得到的獎勵層；與隱藏彩蛋、星星、統計無關） ---------- */
/* 規則：第一次就答對＝我方得分（2～5 的乘法 1 分、6～9 的乘法 2 分；3 個以上乘法表混合再 +1；×1 一律 0 分）；
   第一次答錯＝對手得 1 分。先到目標分數就贏這場比賽。每個賽事 3 場，贏滿 3 場拿獎牌；
   要晉級下一個賽事，還要練熟足夠多個乘法表（某個乘法表 8 題中至少 6 題「會了」以上＝練熟）。 */
var VL_DEF_TEAM='小達人隊';
var VL_ST=[{n:'校內練習賽',t:15,need:0,o:[['🐦','小麻雀隊'],['🐰','跳跳兔隊'],['🐿️','松鼠隊']]},
  {n:'地區預賽',t:20,need:2,o:[['🐧','企鵝隊'],['🐨','無尾熊隊'],['🐢','海龜隊']]},
  {n:'縣市大賽',t:20,need:4,o:[['🐬','海豚隊'],['🐻','黑熊隊'],['🐘','大象隊']]},
  {n:'全國大賽',t:25,need:6,o:[['🐆','獵豹隊'],['🐯','白虎隊'],['🦁','獅子隊']]}];
var VL_PL={2:['小捷','自由球員'],3:['阿穩','接扣手'],4:['高高','副攻手'],5:['小托','舉球員'],6:['飛飛','搶攻手'],7:['阿牆','副攻手'],8:['小旋','接扣手'],9:['阿閃','搶攻手']};
var VL_MEDAL=[['#d08a4e','#f0b27a'],['#a9b3c2','#e4e9f0'],['#e0a800','#ffe27a'],['#e0a800','#ffe27a']];
function vlBlank(){return {v:1,team:VL_DEF_TEAM,st:0,w:[0,0,0,0],fr:0,cw:0,md:[0,0,0,0],pl:{},s:{u:0,o:0},tw:0,tl:0}}
function vlNorm(x){var b=vlBlank();if(!x||typeof x!=='object')return null;
  var t=String(x.team||'').replace(/[<>&"'\s]+/g,' ').trim().slice(0,8);b.team=t||VL_DEF_TEAM;
  b.st=Math.max(0,Math.min(3,Math.floor(+x.st||0)));
